# Every push to main (including a merged pull request) runs the tests and, if
# they pass, tags the next version and publishes a GitHub release for it.
#
# The next version bumps the patch number (v0.1.0 -> v0.1.1). Put #minor or
# #major, as a separate word, in a commit message (or a squash-merged PR's
# title) to bump those instead. Put "[skip ci]" in the pushed commit's message
# to skip the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time, so two quick merges can't claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags and commits since the last release
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Pick the next version
        id: version
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$(git rev-list "$last..HEAD")" ]; then
            echo "No commits since $last, so there's nothing to release."
            exit 0
          fi
          log=$(git log --format=%B "$last..HEAD")
          IFS=. read -r major minor patch <<< "${last#v}"
          patch=${patch%%[-+]*}
          if grep -Eq '(^|[[:space:]])#major([[:space:]]|$)' <<< "$log"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -Eq '(^|[[:space:]])#minor([[:space:]]|$)' <<< "$log"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          echo "Last release: $last. Next: v$major.$minor.$patch"
          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      # Binaries for people without Go. Archive names leave out the version, so
      # .../releases/latest/download/forge_darwin_arm64.tar.gz always works.
      - name: Build binaries
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # Tagging the checkout first makes Go stamp the version that
          # "forge --version" prints. The release step pushes the tag.
          git tag "$TAG"
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*} arch=${target#*/}
            name="forge_${os}_${arch}"
            out="$RUNNER_TEMP/build/$name"
            bin=forge
            if [ "$os" = windows ]; then bin=forge.exe; fi
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$out/$bin" ./cmd/forge
            if [ "$os" = windows ]; then
              (cd "$out" && zip -q "$dist/$name.zip" "$bin")
            else
              tar -czf "$dist/$name.tar.gz" -C "$out" "$bin"
            fi
          done
          (cd "$dist" && sha256sum * > checksums.txt)
          ls -l "$dist"

      - name: Tag and publish the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        # Creates the tag on this commit and attaches the binaries. The install
        # steps go above the generated list of changes since the last release.
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          **macOS or Linux:** download the archive for your system below, or for example on an Apple Silicon Mac:

          \`\`\`sh
          curl -L https://github.com/$GH_REPO/releases/download/$TAG/forge_darwin_arm64.tar.gz | tar xz
          sudo mv forge /usr/local/bin/
          \`\`\`

          Use \`darwin_amd64\` for an Intel Mac and \`linux_amd64\` or \`linux_arm64\` for Linux.

          **Windows:** download \`forge_windows_amd64.zip\` (or \`arm64\`), unzip it and put \`forge.exe\` on your PATH.

          **With Go 1.27+:** \`go install github.com/$GH_REPO/cmd/forge@$TAG\`

          Check with \`forge --version\`. \`checksums.txt\` has SHA-256 sums of the downloads.
          EOF
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
